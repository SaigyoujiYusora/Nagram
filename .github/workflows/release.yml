name: Release Build
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload: If want ignore'
        required: false
jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          append-timestamp: false
          key: native-${{ github.job }}
          max-size: 5G
      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties
      - name: Configure Gradle
        run: |
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Release Build
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}"
          ./gradlew TMessagesProj:assembleRelease --build-cache --no-configuration-cache

          APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Upload gradle.properties
        uses: actions/upload-artifact@v7
        with:
          name: gradle-properties
          path: gradle.properties
      - uses: actions/upload-artifact@v7
        with:
          name: Release
          path: ${{ env.APK }}
  upload:
    name: Upload release
    if: github.event.inputs.upload != 'y'
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Remove gradle.properties
        run: |
          rm -f gradle.properties
      - name: Download gradle.properties
        uses: actions/download-artifact@v8
        with:
          name: gradle-properties
          path: .
      - name: Donwload Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      # Fork: publish to our own Telegram target (HELPER_BOT_TOKEN / HELPER_BOT_TARGET),
      # upstream's channel-publish flow needs NAGRAM_CHANNEL_* secrets we don't have.
      - name: Send to Telegram
        run: |
          # send release via telegram bot api
          export mini64=$(find artifacts -name "*arm64-v8a.apk")
          export mini32=$(find artifacts -name "*armeabi-v7a.apk")

          echo $mini64
          echo $mini32

          python -m pip install -r bin/scripts/requirements.txt
          git log -1 --pretty=format:"%s%n%n%b" > artifacts/caption.txt
          python bin/scripts/upload_fork.py ${{ secrets.HELPER_BOT_TOKEN }} ${{ secrets.HELPER_BOT_TARGET }} release
